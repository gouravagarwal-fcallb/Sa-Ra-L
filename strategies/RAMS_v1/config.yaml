# ─────────────────────────────────────────────────────
#  Sa-Ra-L  |  RAMS v1 — Regime-Adaptive Momentum Scalper
#  1-min 3-layer confluence, Rs.50K live capital
# ─────────────────────────────────────────────────────

strategy_type: 1min_confluence         # engine dispatch key

strategy:
  name: "Sa-Ra-L Weekly Options Strategy"
  version: "2.0"

# ── Instruments ───────────────────────────────────────
instruments:
  nifty:
    symbol: "NIFTY"
    yf_symbol: "^NSEI"
    exchange: "NFO"
    lot_size: 65          # NIFTY lot (65 since 30-Dec-2025; was 75)
    strike_step: 50
    expiry_day: Tuesday        # NSE Nifty 50 weekly expiry
  sensex:
    symbol: "SENSEX"
    yf_symbol: "^BSESN"
    exchange: "BFO"
    lot_size: 20
    strike_step: 100
    expiry_day: Thursday       # BSE Sensex weekly expiry

# ── Trading Schedule ──────────────────────────────────
# Monday    → Nifty 50 (normal day, 2 windows)
# Tuesday   → Nifty 50 EXPIRY (4 windows)
# Wednesday → SKIP (avoided by design)
# Thursday  → Sensex EXPIRY (4 windows)
# Friday    → Nifty 50 (normal day, 2 windows)
trading_schedule:
  skip_wednesday: true
  nifty_days: [Monday, Tuesday, Friday]
  sensex_days: [Thursday]
  nifty_expiry_weekday: 1      # Python weekday: 0=Mon,1=Tue,...
  sensex_expiry_weekday: 3     # Thursday

# ── Trade Windows ─────────────────────────────────────
# Strategy runs continuously — these are entry evaluation points.
# T1 and T3 run every non-Wednesday day.
# T2 and T4 run only on expiry days (Tuesday for Nifty, Thursday for Sensex).
trade_windows:
  - id: T1
    name: "Morning Open"
    start: "09:22"
    end: "10:10"
    expiry_only: false
  - id: T2
    name: "Mid-Morning"
    start: "11:30"
    end: "11:45"
    expiry_only: true
  - id: T3
    name: "Post-Lunch"
    start: "12:45"
    end: "13:20"
    expiry_only: false
  - id: T4
    name: "Late Session"
    start: "14:20"
    end: "14:44"
    expiry_only: true

# ── Exit Rules ────────────────────────────────────────
exit:
  profit_target_pct: 27.5      # Per-trade target: exit at 27.5% gain on premium
  profit_target_min_pct: 25.0
  profit_target_max_pct: 30.0
  force_exit_time: "15:20"     # Hard close 10 minutes before market

# ── Position Sizing (Budget-Based) ────────────────────
# Quantity is NOT fixed. It varies per trade:
#   qty = floor(trade_budget / option_premium / lot_size) * lot_size
# Signal strength maps to budget (sized for Rs.50K total margin):
#   Score 3 (minimum) → Rs. 5,000  (10% of capital)
#   Score 4           → Rs. 10,000 (20% of capital)
#   Score 5+          → Rs. 15,000 (30% of capital — max single trade)
# Note: Nifty lot=75, fires if ATM premium < Rs. 66 (budget/lot) at min budget.
#       At max budget (Rs.15K), fires if ATM premium < Rs. 200.
position_sizing:
  trade_budget_min: 5000        # Rs. 5,000 — weak signal (score = 3)
  trade_budget_max: 15000       # Rs. 15,000 — strong signal (score 5+)
  min_score_for_max_budget: 5   # Score at which max budget kicks in

# ── Risk & P&L Management ────────────────────────────
risk:
  daily_loss_limit: 3500             # Rs. 3,500 — 7% of Rs.50K capital
  base_trades_per_day: 10            # Used to derive per-trade max loss
  # Per-trade max loss (rupees) = daily_loss_limit / base_trades_per_day = Rs. 350
  # Per-trade stop % = per_trade_max_loss / trade_budget (2.3%–7% range)

  paper_mode_after_day_stop: true    # After day stop hit, continue in paper mode
  expected_daily_profit: 1500        # Rs. 1,500 baseline expectation (50K capital scale)
  windfall_multiplier: 2.5           # If profit > 2.5× expected → windfall mode
  windfall_trail_drawdown_pct: 40    # Allow 40% drawdown from peak before closing

# ── Continuous Signal Monitoring ─────────────────────
# Signals checked at every trade evaluation point and continuously during holds.
# Pre-market (scored before 9:15 AM):
#   DOW Jones, Gift Nifty, India VIX, Sensex
# Intraday (re-evaluated continuously):
#   Nifty/Sensex spot, option chain ATM level, IV percentile,
#   OI change, OI change %, Greeks (Delta, Gamma, Theta, Vega, Beta)
signal_monitoring:
  pre_market:
    dow_jones: true
    gift_nifty: true
    india_vix: true
    sensex: true
  intraday:
    spot_price: true
    iv_percentile: true          # Current IV vs 52-week range (0-100%)
    oi_change: true              # Absolute OI change
    oi_change_pct: true          # % OI change from prior day
    greeks:
      delta: true                # Price sensitivity to spot move
      gamma: true                # Rate of change of delta
      theta: true                # Time decay per day
      vega: true                 # Sensitivity to IV change
      beta: true                 # Underlying correlation to broader market
  evaluation_interval_minutes: 1  # Check every 1 min (1-min candle resolution)

# ── Pre-Market Direction Engine ───────────────────────
direction:
  score_thresholds:
    bullish_min: 4    # Score >= 4 → BULLISH (strong conviction only)
    bearish_max: -4   # Score <= -4 → BEARISH (strong conviction only)

  dow_jones:
    strong_up: 1.0
    mild_up: 0.3
    mild_down: -0.3
    strong_down: -1.0

  gift_nifty:
    strong_premium: 100
    mild_premium: 30
    mild_discount: -30
    strong_discount: -100

  india_vix:
    calm_below: 13.0
    normal_above: 13.0
    elevated_above: 18.0
    panic_above: 22.0

  sensex:
    up_threshold: 0.3
    down_threshold: -0.3

  # Intraday re-evaluation — called at every 5-min candle during the session.
  # Replaces pre-market direction for actual entry decisions.
  # Pre-market (Dow + Gift Nifty) still gates whether the day is tradeable
  # and sets position size; intraday signals decide BUY CALL vs BUY PUT.
  intraday:
    score_thresholds:
      bullish_min: 3      # Intraday must confirm pre-market — clear momentum required
      bearish_max: -3
    spot_change:          # Spot % change from previous day's close  (-2 to +2)
      strong_up:    1.0
      mild_up:      0.3
      mild_down:   -0.3
      strong_down: -1.0
    momentum:             # Spot vs today's open — is the intraday move continuing?  (-1/0/+1)
      bullish_above:  0.2  # Spot > open + 0.2% → momentum bullish
      bearish_below: -0.2  # Spot < open − 0.2% → momentum bearish

# ── Option Chain Filters ──────────────────────────────
option_chain:
  oi_range_morning_pts: 100    # OI analysis range: ATM +/- 100 pts before noon
  oi_range_afternoon_pts: 50   # Narrow to ATM +/- 50 pts after noon
  noon_cutoff: "12:00"
  min_delta: 0.40              # ATM delta must be >= 0.40
  max_vix_for_entry: 18.0      # Hard block if India VIX > 18 (elevated volatility = unpredictable)
  min_oi_buildup_pct: 5.0      # OI must show >= 5% increase (fresh buildup)

# ── Backtesting ───────────────────────────────────────
backtest:
  start_date: "2023-01-01"
  end_date: "2026-06-19"
  initial_capital: 50000       # Rs. 50K — live capital
  risk_free_rate: 0.065        # 6.5% p.a. for Black-Scholes
  slippage_pct: 0.1            # 0.1% slippage per side
  brokerage_per_order: 20      # Rs. 20 flat per order (Zerodha F&O) — NOT per lot
  # Full transaction cost model (applied per trade round-trip):
  #   Brokerage    : Rs. 40 flat (Rs. 20 buy + Rs. 20 sell)
  #   STT          : 0.1% on sell-side premium value
  #   Exchange levy: 0.0495% NSE / 0.035% BSE on total premium turnover
  #   Stamp duty   : 0.003% on buy-side value
  #   SEBI charges : 0.0001% on total turnover
  #   GST          : 18% on (brokerage + exchange levy)
