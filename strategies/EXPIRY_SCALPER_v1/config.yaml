# ─────────────────────────────────────────────────────
#  Sa-Ra-L  |  EXPIRY_SCALPER v1
#  Post-14:45 near-zero premium gamma scalp
# ─────────────────────────────────────────────────────

strategy_type: expiry_scalper          # engine dispatch key

strategy:
  name: "Expiry Scalper v1"
  version: "1.0"

# ── Instruments ───────────────────────────────────────
instruments:
  nifty:
    symbol: "NIFTY"
    yf_symbol: "^NSEI"
    exchange: "NFO"
    lot_size: 75
    strike_step: 50
  sensex:
    symbol: "SENSEX"
    yf_symbol: "^BSESN"
    exchange: "BFO"
    lot_size: 20
    strike_step: 100

# ── Expiry Scalper Parameters ─────────────────────────
expiry_scalper:
  # Only fires after this time on expiry days
  entry_after_time: "14:45"
  hard_close_time:  "15:29"   # 1 minute before market close

  # Momentum detection (reference = spot at 14:45)
  momentum_threshold_pct: 0.25   # 0.25% move = ~62 pts on Nifty 25000
  volume_surge_multiplier: 1.3   # Volume must be ≥ 1.3× last 5-candle average
  max_entry_time: "15:10"        # No new entries after 15:10

  # Option selection — buy OTM in direction of momentum
  otm_strikes: 2                 # 2 strikes away from ATM (100 pts for Nifty)
  max_premium_rs: 25             # Skip if premium > Rs.25 (not near-zero)
  min_premium_rs: 0.5            # Skip if premium < Rs.0.50 (illiquid)

  # Position sizing — FIXED budget (binary bet)
  trade_budget_rs: 10000         # Rs.10,000 fixed regardless of score

  # Exit rules
  target_multiplier: 5.0         # Exit at 5× entry (400% gain)
  stop_loss_pct: 50              # Exit at -50% (lose half the budget)
  # If neither hit: forced close at hard_close_time

# ── Pre-Market Direction (still used for bias, NOT to gate the day) ──────────
direction:
  score_thresholds:
    bullish_min: 3
    bearish_max: -3
  dow_jones:
    strong_up: 1.0
    mild_up: 0.3
    mild_down: -0.3
    strong_down: -1.0
  gift_nifty:
    strong_premium: 100
    mild_premium: 30
    mild_discount: -30
    strong_discount: -100
  india_vix:
    calm_below: 13.0
    normal_above: 13.0
    elevated_above: 18.0
    panic_above: 22.0
  sensex:
    up_threshold: 0.3
    down_threshold: -0.3

# ── Risk ──────────────────────────────────────────────
risk:
  daily_loss_limit: 10000        # Accept full Rs.10K loss per expiry (sized for it)
  paper_mode_after_day_stop: false

# ── Option Chain ──────────────────────────────────────
option_chain:
  max_vix_for_entry: 35.0        # Allow higher VIX — near-expiry gamma is the edge

# ── Backtesting ───────────────────────────────────────
backtest:
  start_date: "2023-01-01"
  end_date: "2026-06-22"
  initial_capital: 50000
  risk_free_rate: 0.065
  slippage_pct: 0.2              # Higher slippage — illiquid near-expiry options
  brokerage_per_lot: 20
