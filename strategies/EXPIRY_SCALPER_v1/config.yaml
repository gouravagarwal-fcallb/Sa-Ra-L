# ─────────────────────────────────────────────────────
#  Sa-Ra-L  |  EXPIRY_SCALPER v1
#  Expiry-day momentum scalper — three entry windows
# ─────────────────────────────────────────────────────

strategy_type: expiry_scalper          # engine dispatch key

strategy:
  name: "Expiry Scalper v1"
  version: "2.0"

# ── Instruments ───────────────────────────────────────
instruments:
  nifty:
    symbol: "NIFTY"
    yf_symbol: "^NSEI"
    exchange: "NFO"
    lot_size: 65          # NIFTY lot (65 since 30-Dec-2025; was 75)
    strike_step: 50
  sensex:
    symbol: "SENSEX"
    yf_symbol: "^BSESN"
    exchange: "BFO"
    lot_size: 20
    strike_step: 100

# ── Expiry Scalper Parameters ─────────────────────────
expiry_scalper:

  hard_close_time:        "15:29"   # Force exit everything 1 min before close
  volume_surge_multiplier: 1.3      # Volume must be ≥ 1.3× last 5-bar average
  otm_strikes:             2        # Buy 2 strikes OTM in breakout direction
  trade_budget_rs:         10000    # Rs.10K per trade (fixed, binary bet)
  max_trades_per_day:      3        # Max 1 trade per window (3 windows = 3 max)

  # ── Polish flags (ALL OFF by default → identical to original behaviour) ──────
  # Turn ON, then BACKTEST on real Kite history to confirm the numbers improve
  # BEFORE trusting. Trust win-rate / frequency / shape, not the modelled rupees.
  #
  # #1 Breakout confirmation — require the move to PERSIST for N consecutive 1-min
  #    scans before entering (filters one-tick spikes; the live volume gate is not
  #    available on the spot-only feed, so this is the honest confirmation lever).
  confirm_breakout:        false
  confirmation_ticks:      2        # consecutive scans beyond threshold to fire
  #
  # #2 Partial-book + trailing stop — book part of the position when it pops, move
  #    the remainder's stop to breakeven, and (optionally) trail it under the peak.
  #    Turns "ran up then round-tripped to a full stop" losers into small wins while
  #    keeping a runner for the big tail (payoff-preserving; NOT win-rate chasing).
  #    These are the STRATEGY-LEVEL defaults; ANY window below can override any of
  #    them (clean-A/B finding: trailing helps W1/W3 for free but costs W2 ~₹3.4L,
  #    so trail W1/W3 and leave W2 on its fixed stop — see per-window keys).
  partial_book:            false
  partial_trigger_mult:    1.6      # book a slice once premium ≥ 1.6× entry
  partial_fraction:        0.5      # sell 50% of the position at the trigger
  move_stop_to_breakeven:  true     # after the partial, remainder's stop → entry
  trail_stop:              false    # trail the remainder's stop under the peak
  trail_pct:               0.30     # trail 30% below the highest premium seen

  # ── Trading windows ──────────────────────────────────
  # Each window has its own entry conditions, premium range, and risk/reward.
  # The reference spot for momentum is reset at the start of each window.
  # At most one trade fires per window.
  #
  # Physics: higher premium = more time value = lower gamma leverage → tighter target
  #          lower premium  = pure gamma bet   → aggressive target
  # ─────────────────────────────────────────────────────
  windows:

    - id:   "W1"
      name: "Morning Momentum"
      start: "09:30"
      end:   "11:30"
      # Lowered threshold: captures directional move before premium fully runs
      momentum_threshold_pct: 0.20   # was 0.40 — any ~50 pt Nifty move is a signal
      otm_strikes: 2
      max_premium_rs: 150
      min_premium_rs: 25
      target_multiplier: 2.5         # 2.5× entry (150% gain)
      stop_loss_pct: 35              # -35% stop
      # Only enter if breakout matches pre-market direction score (score ≥ 3 or ≤ -3)
      require_score_direction: true
      # A/B candidate: trailing helps W1 (clean 295-trade test). Validate, then keep/revert.
      trail_stop: true
      trail_pct: 0.40

    - id:   "W2"
      name: "Midday Compression"
      start: "13:00"
      end:   "14:30"
      # Mid-session: time value collapsing, gamma picking up — smaller trigger needed
      momentum_threshold_pct: 0.15   # was 0.30 — ~37 pt Nifty move
      otm_strikes: 2
      max_premium_rs: 60
      min_premium_rs: 5
      target_multiplier: 3.5         # 3.5× entry (250% gain)
      stop_loss_pct: 45
      require_score_direction: false  # Pure momentum — direction score irrelevant

    - id:   "W3"
      name: "End-of-Day Gamma"
      start: "14:45"
      end:   "15:10"
      # Extreme gamma: even 0.10% (~24 pts) can 5-10× a near-ATM option
      momentum_threshold_pct: 0.10   # was 0.25
      otm_strikes: 1                 # 1 OTM (was 2) — higher delta, better gamma response
      max_premium_rs: 50             # adjusted for 1-OTM pricing (wider range)
      min_premium_rs: 1.0            # adjusted for 1-OTM pricing
      target_multiplier: 5.0         # 5× entry (400% gain)
      stop_loss_pct: 50
      require_score_direction: false  # Pure gamma bet
      # A/B candidate: trailing is "free" on W3 (same profit, higher win rate). Validate.
      trail_stop: true
      trail_pct: 0.40

# ── Pre-Market Direction (used by W1 require_score_direction) ────────────────
direction:
  score_thresholds:
    bullish_min: 3
    bearish_max: -3
  dow_jones:
    strong_up: 1.0
    mild_up: 0.3
    mild_down: -0.3
    strong_down: -1.0
  gift_nifty:
    strong_premium: 100
    mild_premium: 30
    mild_discount: -30
    strong_discount: -100
  india_vix:
    calm_below: 13.0
    normal_above: 13.0
    elevated_above: 18.0
    panic_above: 22.0
  sensex:
    up_threshold: 0.3
    down_threshold: -0.3

# ── Risk ──────────────────────────────────────────────
risk:
  daily_loss_limit: 10000       # TEST cap: Rs.10K max loss today (0.10L test)
  paper_mode_after_day_stop: true   # fallback to paper after limit hit (not hard stop)

# ── Option Chain ──────────────────────────────────────
option_chain:
  max_vix_for_entry: 35.0       # Allow higher VIX — near-expiry gamma is the edge

# ── Backtesting ───────────────────────────────────────
backtest:
  start_date: "2023-01-01"
  end_date: "2026-06-22"
  initial_capital: 50000
  risk_free_rate: 0.065
  slippage_pct: 0.2             # Higher slippage — illiquid near-expiry options
  brokerage_per_lot: 20
