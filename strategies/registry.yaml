# ══════════════════════════════════════════════════════════════════════════════
#  Sa-Ra-L  |  Strategy Registry
#  Master control sheet for all algo strategies
#  Add a new entry here whenever a new strategy is created.
# ══════════════════════════════════════════════════════════════════════════════
#
#  Portfolio Vision (Rs.50L total capital)
#  ─────────────────────────────────────────
#  Capital rule:  1:4 ratio — only 20% deployed at any time (Rs.10L live)
#                             80% held free   (Rs.40L reserve)
#  Target return: Rs.5 Crore from Rs.50L (10× over 3–5 years)
#  Structure:     10 independent strategies × Rs.5L each
#                 Each strategy runs its own logic, risk limits, and instruments.
#
#  Strategy pipeline (status codes):
#    live        → deployed in real market, real money
#    paper       → running live but with paper broker (shadow mode)
#    testing     → backtest / WFV phase, no live trading
#    planned     → concept only, not yet coded
#    paused      → built but not currently running
#
# ══════════════════════════════════════════════════════════════════════════════

strategies:

  # ──────────────────────────────────────────────────────────────────────────
  SRAL_v1:
    full_name:    "Sa-Ra-L v1.0 — Original Fixed-Quantity 5-min Strategy"
    type:         5min_fixed_quantity
    instruments:  [NIFTY, SENSEX]
    status:       archived          # superseded by RAMS_v1
    risk_profile: very_high         # 347 Nifty lots = Rs.26K/trade at Rs.75 premium
    capital_allocated_rs: 10000000  # Rs.1 Crore (original design)
    capital_target_rs:    60000000  # Rs.60L was the user's scale-up intent

    description: >
      First-ever strategy. Fixed 347 Nifty lots (Rs.26,000 qty) per trade.
      Pre-market scoring identical to RAMS (DOW + Gift Nifty + VIX + Sensex).
      Intraday logic: 5-min candle evaluate_intraday() — EMA, RSI, VWAP on
      5-min bars. Trade windows T1/T2/T3/T4 only (no off-windows).
      Score ≥ 3 → BULLISH, ≤ -3 → BEARISH. 27.5% profit target, Rs.10L daily stop.
      No budget scaling — fixed quantity regardless of signal strength.

    archive_reason: >
      Replaced by RAMS_v1 which adds 1-min 3-layer confluence for higher
      precision entries, budget-based scaling, and continuous re-entry within
      windows. SRAL_v1 is kept for reference and benchmarking.

    entry_logic:       5-min EMA9/21 + RSI14 + VWAP (evaluate_intraday)
    exit_logic:        27.5% target OR Rs.10L daily stop
    budget_range_rs:   [26000, 26000]   # Fixed: 347 lots × Rs.75 premium
    daily_stop_rs:     1000000          # Rs.10 Lakh

    first_commit:      49625ea
    created:           2026-06-01       # approximate from git log

    wfv_results:       null             # was not run with named strategy framework
    config_file:    strategies/SRAL_v1/config.yaml
    results_dir:    strategies/SRAL_v1/results/

  # ──────────────────────────────────────────────────────────────────────────
  RAMS_v1:
    full_name:    "RAMS v1 — Regime-Adaptive Momentum Scalper"
    type:         intraday_1min
    instruments:  [NIFTY, SENSEX]
    status:       live
    risk_profile: moderate
    capital_allocated_rs: 50000          # Rs. 50K (current live deployment)
    capital_target_rs:    500000         # Rs. 5L (scale-up target)

    description: >
      Pre-market regime scoring (DOW + Gift Nifty + VIX + Sensex) sets budget
      and direction bias. Intraday entry via 3-layer 1-min confluence:
      Layer 1 = 5-min EMA9/21 + RSI14 + VWAP; Layer 2 = 1-min EMA5/13 + RSI7
      + volume; Layer 3 = candle quality (body ≥ 40%, breakout, consecutive).
      Standard window schedule (OW0/T1/OW1/T3/OW2). MIS product, auto-square 15:20.

    entry_logic:       3-layer 1-min confluence (evaluate_1min)
    exit_logic:        27.5% target OR dynamic stop (per-trade max loss / position value)
    budget_range_rs:   [5000, 15000]
    daily_stop_rs:     3500

    wfv_results:
      last_run:        2026-06-22
      folds:           8
      active_folds:    5
      profitable_folds: 3
      consistency_pct:  60
      verdict:          MODERATE
      combined_pnl_rs:  50506
      best_fold_pnl_rs: 37658    # Fold 4, 2024-08-05 crash day
      sharpe_fold8:     3.20

    config_file:    strategies/RAMS_v1/config.yaml
    results_dir:    strategies/RAMS_v1/results/

  # ──────────────────────────────────────────────────────────────────────────
  EXPIRY_SCALPER_v1:
    full_name:    "Expiry Scalper v1 — Multi-Window Expiry Day Scalper"
    type:         expiry_scalper
    instruments:  [NIFTY, SENSEX]
    status:       live                # TEST: 0.10L/trade, daily loss cap Rs.10K
    risk_profile: very_high
    capital_allocated_rs: 10000       # Rs. 10K test allocation
    capital_target_rs:    500000      # Rs. 5L allocated when live

    description: >
      Three entry windows on expiry days — W1 Morning (09:30-11:30, Rs.25-150 prem,
      2.5× target, score-aligned only), W2 Midday (13:00-14:30, Rs.5-60, 3.5× target),
      W3 End-of-Day (14:45-15:10, Rs.0.5-25, 5× target / pure gamma). Fixed Rs.10K
      budget per window trade. 0.25-0.40% momentum breakout + volume surge trigger.
      Hard close 15:29. Daily stop Rs.30K (3 trades × Rs.10K each).

    entry_logic:       >
      W1: 0.40% move + score direction confirmed; W2: 0.30% move; W3: 0.25% move.
      All: 2 strikes OTM in breakout direction, 1.3× volume surge.
    exit_logic:        per-window target (2.5×/3.5×/5×) OR per-window stop (35%/45%/50%) OR 15:29 force close
    budget_range_rs:   [10000, 30000]  # Rs.10K per window, up to 3 windows
    daily_stop_rs:     30000

    math_example: >
      W3 Nifty at 25000, post-14:45, option premium Rs.5 (2 strikes OTM).
      Budget Rs.10K → qty=150. Move 300pts → Rs.100 → P&L: 150×95=Rs.14,250 (142%).
      W1 Nifty at 25000, 10:30, premium Rs.80 (2 strikes OTM).
      Budget Rs.10K → qty=2 lots(150). Target 2.5× → Rs.200 → P&L: 150×120=Rs.18,000.

    wfv_results:       null             # Run backtest first
    config_file:    strategies/EXPIRY_SCALPER_v1/config.yaml
    results_dir:    strategies/EXPIRY_SCALPER_v1/results/

  # ──────────────────────────────────────────────────────────────────────────
  RANGE_SCALPER_v1:
    full_name:    "Range Scalper v1 — Mean Reversion on Range-Bound Days"
    type:         range_scalper
    instruments:  [NIFTY, SENSEX]
    status:       paper               # live engine ready; paper mode first
    risk_profile: low_moderate
    capital_allocated_rs: 0
    capital_target_rs:    300000      # Rs. 3L allocated when live (6 trades × Rs.10K each)

    description: >
      Three-phase validation gate before any trade fires:
      FORMING (09:15-09:45): collect 30-min OHLC, range must be ≤ 0.20% of open.
      VALIDATING (09:45-10:00): 15 min without breakout confirms range is real.
      TRADING (10:00-13:00): buy CE at R_low, buy PE at R_high on each boundary touch.
      INVALIDATED: 2 consecutive bars outside breakout buffer → close all, stop.
      ATM options only. Not active on expiry days (use EXPIRY_SCALPER_v1 instead).

    entry_logic:       >
      ATM CE when spot within 0.05% of R_low (bounce up expected).
      ATM PE when spot within 0.05% of R_high (sell-off expected).
      Skips if VIX > 16, Dow > ±0.30%, or Gift Nifty outside ±40 pts.
    exit_logic:        +40% target OR −25% stop OR 13:00 hard close OR range broken
    budget_range_rs:   [10000, 60000]  # Rs.10K per trade, up to 6 per day
    daily_stop_rs:     20000

    math_example: >
      Nifty 24500 range-bound at ±0.15%. R_high=24537, R_low=24463.
      Spot touches R_high=24537 → buy ATM 24500 PE @ Rs.40.
      Budget Rs.10K → qty=250. Target Rs.56 (+40%) → P&L: 250×16=Rs.4,000.
      Stop Rs.30 (-25%) → Max loss: 250×10=Rs.2,500 (same trade).

    wfv_results:       null             # Run backtest first (requires non-expiry 1-min data)
    config_file:    strategies/RANGE_SCALPER_v1/config.yaml
    results_dir:    strategies/RANGE_SCALPER_v1/results/

  # ──────────────────────────────────────────────────────────────────────────
  BLACK_SWAN_v1:
    full_name:    "Black Swan v1 — Extreme Move Momentum Scalper"
    type:         black_swan
    instruments:  [NIFTY]
    status:       paper              # paper mode first — monitor for 2-4 weeks
    risk_profile: very_high
    capital_allocated_rs: 0
    capital_target_rs:    200000    # Rs. 2L allocated when live

    description: >
      Fires on ANY trading day when Nifty shows extreme moves:
        Trigger A: Gap open ≥1.5% from previous close (detects overnight events)
        Trigger B: Intraday move ≥2.0% from 9:15 open (detects intraday panic)
        Trigger C: VIX ≥22 → threshold drops to 1.2% (fear is already elevated)
      One trade per day maximum. Buys 1 OTM Nifty weekly call or put.
      90-minute time stop — exits even if neither target nor stop is hit.
      Hard close at 15:20.

      Use cases: PM/President assassination, war outbreak, election shock,
      budget day panic, global flash crash, geopolitical crisis.

    entry_logic:  >
      gap≥1.5% from prev_close  OR  intraday≥2.0% from 9:15 open
      (reduces to 1.2% when VIX≥22). 1-strike OTM option in breakout direction.
    exit_logic:   4× target  OR  40% stop  OR  90-min time stop  OR  15:20 force close
    budget_range_rs:  [20000, 20000]
    daily_stop_rs:    20000

    math_example: >
      Nifty at 24000, war news → opens -3% (23280).
      PE 23950 premium at open: Rs.150 (inflated IV).
      Budget Rs.20K → qty=150 (2 lots). Target 4× = Rs.600.
      If Nifty falls another 300pts intraday: PE → Rs.800.
      P&L: 150 × (600 - 150) = Rs.67,500.

    wfv_results:       null          # historical black swan events need custom backtest
    config_file:    strategies/BLACK_SWAN_v1/config.yaml
    results_dir:    strategies/BLACK_SWAN_v1/results/

  # ──────────────────────────────────────────────────────────────────────────
  NIFTY_INTRADAY_v1:
    full_name:    "Nifty Intraday v1 — Pure Options Buying Intraday Scalper"
    type:         nifty_intraday
    instruments:  [NIFTY]
    status:       paper              # paper mode first — monitor for 2 weeks
    risk_profile: moderate
    capital_allocated_rs: 50000     # Rs. 50K
    capital_target_rs:    500000    # Rs. 5L allocated when live

    description: >
      Pure Nifty 50 options buying. No BankNifty, no futures, no selling.
      Regime-adaptive: TREND day → 15-min ORB breakout; RANGE day → S/R rejection.
      Regime refreshed every 15 min using ATR vs median, VWAP slope, ORB position.
      Position sizing guarantees ₹1,200 max loss per trade regardless of premium.
      Breakeven trail after 50% of target reached. One open trade at a time.
      Unlimited trades per day with cooldowns. Hard close at 15:10 IST.

    entry_logic:  >
      TREND: 15-min ORB breakout + VWAP side + 1.3× volume surge.
      RANGE: close within 0.15% of S/R + RSI < 35 / > 65 + reversal candle.
    exit_logic:   ₹2,750 target OR ₹1,200 stop (BE trail after 50%) OR 15:10 force close
    budget_range_rs:   [6750, 10000]   # floor(10K / (LTP × 75)) × 75 × LTP
    daily_stop_rs:     4800

    math_example: >
      ATM CE @ Rs.120. max_lots=floor(10000/9000)=1. qty=75.
      stop=120-16=Rs.104. target=120+36.7=Rs.156.7. be=Rs.138.3.
      Max loss: 16×75=Rs.1,200. Max gain: 36.7×75=Rs.2,750. R:R=1:2.29.

    wfv_results:       null          # backtest pending (Jan2024–Jun2026 planned)
    config_file:    strategies/NIFTY_INTRADAY_v1/config.yaml
    results_dir:    strategies/NIFTY_INTRADAY_v1/results/

  # ──────────────────────────────────────────────────────────────────────────
  GAP_FADE_v1:
    full_name:    "Gap Fade v1 — Opening Range Reversion"
    type:         opening_range
    instruments:  [NIFTY, BANKNIFTY]
    status:       planned
    risk_profile: low
    capital_allocated_rs: 0
    capital_target_rs:    500000

    description: >
      Targets days where pre-market shows gap-up/gap-down > 0.5% but intraday
      direction reverses within first 30 minutes. Fades the gap using OTM options
      in the opposite direction. Conservative — only trades if VIX < 15 and
      option premium is reasonably priced.

    entry_logic:       gap > 0.5%, 5-min reversal candle, RSI divergence
    exit_logic:        15% target OR 30-min window close
    budget_range_rs:   [5000, 10000]
    daily_stop_rs:     2000

    wfv_results:       null
    config_file:    strategies/GAP_FADE_v1/config.yaml
    results_dir:    strategies/GAP_FADE_v1/results/

  # ──────────────────────────────────────────────────────────────────────────
  TREND_RIDER_v1:
    full_name:    "Trend Rider v1 — Strong Trend Day Momentum"
    type:         trend_following
    instruments:  [NIFTY, SENSEX]
    status:       planned
    risk_profile: moderate_high
    capital_allocated_rs: 0
    capital_target_rs:    500000

    description: >
      Opposite philosophy to RAMS: looks for days with strong directional
      conviction from open. Entry after 9:45 AM if index makes new 30-min
      high/low with expanding volume and RSI > 65 or < 35. Uses wider stops
      (10%) but targets 50%+ option move. Holds through lunch hour — unlike
      RAMS which re-enters each slot, this holds the same position all day.

    entry_logic:       post-9:45 new 30-min extreme + volume + RSI extreme
    exit_logic:        50% target OR 10% stop OR 14:45 force close
    budget_range_rs:   [10000, 25000]
    daily_stop_rs:     5000

    wfv_results:       null
    config_file:    strategies/TREND_RIDER_v1/config.yaml
    results_dir:    strategies/TREND_RIDER_v1/results/

  # ──────────────────────────────────────────────────────────────────────────
  VIX_SELLER_v1:
    full_name:    "VIX Seller v1 — High Volatility Mean Reversion"
    type:         volatility_mean_reversion
    instruments:  [NIFTY]
    status:       planned
    risk_profile: high
    capital_allocated_rs: 0
    capital_target_rs:    500000

    description: >
      Activates ONLY when India VIX > 22. Sells iron condors or strangles on
      days where VIX spikes but index is range-bound. Profit comes from IV crush
      after the volatility event passes. Requires options selling margin (not
      just buying premium), so capital requirement is 5–10× higher.
      NOT recommended until Rs.5L+ is allocated to this slot.

    entry_logic:       VIX > 22, index within prior day range, sell ATM strangle
    exit_logic:        30% premium decay OR 2-day hold max
    budget_range_rs:   [50000, 100000]   # Options selling requires more margin
    daily_stop_rs:     15000

    wfv_results:       null
    config_file:    strategies/VIX_SELLER_v1/config.yaml
    results_dir:    strategies/VIX_SELLER_v1/results/

