# ══════════════════════════════════════════════════════════════════
#  GAP_FADE_v1  |  Opening Range Reversion
#  Fades a >0.5% gap open that reverses within the first 30 minutes.
#  Conservative: only when VIX is calm. Buys OTM options opposite the gap.
# ══════════════════════════════════════════════════════════════════

strategy_type: gap_fade

instruments:
  nifty:
    lot_size: 65          # NIFTY lot (65 since 30-Dec-2025)
    strike_step: 50

gap_fade:
  # ── Trigger ───────────────────────────────────────────────────
  gap_min_pct:        0.5    # |gap from prev close| to even CONSIDER the day
  reversal_confirm_pct: 0.15 # price must retrace this % back toward prev close
  max_vix:            15.0   # skip if India VIX above this (too unstable to fade)

  # ── Conviction filters (added 2026-07-22 — take only high-quality fades) ──────
  # Fewer, better trades. Backtest measures the TRUE profit factor these produce;
  # these are principled defaults, NOT tuned to hit a target number (that would be
  # curve-fitting). Loosen/tighten and re-backtest to see the honest effect.
  gap_strong_pct:     0.7    # only actually FIRE on a gap at least this big
  rsi_pe_max:         45     # gap-up PE only if RSI < 45 (momentum has clearly rolled over)
  rsi_ce_min:         55     # gap-down CE only if RSI > 55 (mirror)
  reversal_min_body_pct: 0.10 # the reversal 5-min candle body must be ≥0.10% of price (no dojis)

  # ── Entry ─────────────────────────────────────────────────────
  otm_strikes:        1      # 1 strike OTM in the FADE direction
  trade_budget_rs:    10000  # Rs.10K per trade
  window_start:       "09:15"
  window_end:         "09:45" # only fade inside the first 30 minutes

  # ── Exit ──────────────────────────────────────────────────────
  # RESHAPED 2026-07-22: the old +15%/−30% was a 0.5:1 reward:risk that needed a
  # ~67% win rate to break even; at the true 44% win it lost money. Flipped to a
  # target-favoured 1.5:1 (break-even ~40% win) so a 44%-ish fade is net-positive.
  # If the wider target holds the win rate, push target higher; if it craters the
  # win rate, tighten back toward 1:1. Empirical — re-backtest after any change.
  target_pct:         0.30   # +30% on premium
  stop_pct:           0.20   # −20% on premium
  hard_close_time:    "10:15" # force-close 30 min after window

risk:
  daily_loss_limit:   2000

backtest:
  start_date: "2024-01-01"
  end_date:   "2026-06-19"
  slippage_pct:   0.1
  risk_free_rate: 0.065
  initial_capital: 10000
